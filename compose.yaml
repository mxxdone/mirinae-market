services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_DB: mirinae
      POSTGRES_USER: mirinae
      POSTGRES_PASSWORD: mirinae-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mirinae -d mirinae"]
      interval: 5s
      timeout: 5s
      retries: 20
  # 인증 상태 전용 Redis. 재시작 시 로그인/OAuth 미완료 상태가 사라지는 것을 의도하며 영속화하지 않는다.
  redis:
    image: redis:7.4-alpine
    command:
      [
        "redis-server",
        "--save", "",
        "--appendonly", "no",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
