spring:
  application:
    name: mirinae-market
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mirinae}
    username: ${DB_USERNAME:mirinae}
    password: ${DB_PASSWORD:mirinae-local}
  jackson:
    deserialization:
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    path: /v3/api-docs